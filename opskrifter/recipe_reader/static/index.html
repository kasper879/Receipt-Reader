<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Opskrifter</title>
<!-- Alle URL'er er relative, fordi Ingress serverer appen under en dynamisk sti. -->
<link rel="stylesheet" href="static/style.css">
<script type="module" src="static/app.js"></script>
</head>
<body>
<main class="page" id="forside" data-view="forside">
  <header class="mast">
    <div class="kicker" id="kicker">Biblioteket</div>
    <h1>Hvad skal vi lave i dag?</h1>
    <input class="search" type="search" placeholder="Søg efter ret, ingrediens eller kilde …" aria-label="Søg i biblioteket">
  </header>
  <button class="new" type="button" id="new-recipe">
    <span class="new-ic" aria-hidden="true">📷</span>
    <span><b>Ny opskrift</b><small>Fotografér en side fra en bog eller et kort, eller hent den fra et link</small></span>
    <span aria-hidden="true">→</span>
  </button>
  <div id="notes"></div>
  <nav id="controls" class="controls" aria-label="Sortering og tags"></nav>
  <div id="lib" class="lib" aria-live="polite"></div>
  <footer class="foot"><a href="#papirkurv">Papirkurv</a></footer>
</main>
<article class="page recipe" id="opskrift" data-view="opskrift" hidden></article>
<section class="page recipe" id="papirkurv" data-view="papirkurv" hidden></section>
<section class="page recipe" id="ny" data-view="ny" hidden></section>
<section class="recipe" id="gennemsyn" data-view="gennemsyn" hidden></section>
<section class="recipe" id="rediger" data-view="rediger" hidden></section>
<div class="viewer" id="viewer" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
